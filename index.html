<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Win a Nest Learning Thermostat | Modernize Home Sweepstakes</title>
    <meta name="description" content="Enter to win a 3rd generation Nest Learning Thermostat worth $249.">
    <meta name="keywords" content="Nest thermostat, smart home, sweepstakes, home improvement, energy savings">
    <meta property="og:title" content="Enter to win a 3rd generation Nest Learning Thermostat worth $249.">
    <meta property="og:description" content="Enter to win a 3rd generation Nest Thermostat">
    <meta property="og:type" content="website">
    <link rel="canonical" href="https://your-domain.com/sweepstakes">
    <link rel="stylesheet" href="./styles/global.css">
    <link rel="stylesheet" href="./styles/nav.css">
    <link rel="stylesheet" href="./styles/form.css">
    <link rel="stylesheet" href="./styles/card.css">
</head>
<body>
    <nav>
        <a href="/" aria-label="Modernize Home Page">
            <img class="logo" src="./assets/logo.svg" alt="Modernize logo">
        </a>
    </nav>
    <div id="background">
        <div id="backgroundGradient"></div>
    </div>
    <div id="pageContent">
        <div class="form">
            <div class="form__container">
                <div class="form__header">
                    <h5>Enter to win a 3rd generation Nest Learning Thermostat worth $249.</h5>
                </div>
                <div class="form__body">
                    <form id="form">
                        <div class="form__row">
                            <input type="text" name="name" placeholder="Name" required>
                        </div>
                        <div class="form__row" id="cityRow">
                            <input type="text" name="city" placeholder="City">
                            <input type="text" name="state" placeholder="State">
                        </div>
                        <div class="form__row">
                            <input type="tel" name="phone" id="phone" placeholder="Phone Number" maxlength="14" required>
                        </div>
                        <div class="form__row">
                            <input type="email" name="email" placeholder="Email Address" required>
                        </div>
                        <div id="submitRow">
                            <input type="submit" id="submitButton" value="ENTER TO WIN">
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <div class="card">
            <div class="card__outter">
                <p class="card__title">even more savings</p>
                <div class="card__inner">
                    <h6>ADVERTORIAL</h6>
                    <h4>Tricks Homeowners Use to Eliminate&nbsp;Bills</h4>
                    <p>Surging energy bills, unpredictable weather patterns and dissatisfaction with utility companies have homeowners scrambling... <a target="_blank" href="https://www.google.com/" aria-label="Read More">read more</a></p>
                </div>
            </div>
        </div>
    </div>
    <script>
        const formatPhoneNumber = (value) => {
            const digits = value.replace(/\D/g, '');
            const isValid = digits.length === 10;
            
            phoneInput.classList.toggle('error', !isValid);
            
            if (!digits.length) return '';
            if (digits.length <= 3) return `(${digits}`;
            if (digits.length <= 6) return `(${digits.slice(0,3)}) ${digits.slice(3)}`;
            return `(${digits.slice(0,3)}) ${digits.slice(3,6)}-${digits.slice(6,10)}`;
        };

        const updateButtonState = (button, text, disabled) => {
            button.value = text;
            button.disabled = disabled;
        };

        const disableForm = (form) => {
            Array.from(form.getElementsByTagName('input'))
                .forEach(input => input.disabled = true);
        };

        const validateName = (form) => {
            const nameInput = form.querySelector('input[name="name"]');
            const isValid = nameInput.value.trim().length >= 2;
            
            if (!isValid) {
                nameInput.classList.add('error');
            } else {
                nameInput.classList.remove('error');
            }
            
            return isValid;
        };

        const validatePhone = (form) => {
            const phoneInput = form.querySelector('input[name="phone"]');
            const digits = phoneInput.value.replace(/\D/g, '');
            return digits.length === 10;
        };

        const handleSubmit = async (form, submitButton) => {
            const isNameValid = validateName(form);
            const isPhoneValid = validatePhone(form);

            if (!isNameValid || !isPhoneValid) {
                updateButtonState(submitButton, 'ENTER TO WIN', false);
                return;
            }

            const data = Object.fromEntries(new FormData(form));
            
            try {
                const response = await fetch('https://formsws-hilstaging-com-0adj9wt8gzyq.runscope.net/solar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (!response.ok) throw new Error('Submission failed');

                updateButtonState(submitButton, 'Submitted', true);
                disableForm(form);
            } catch (error) {
                updateButtonState(submitButton, 'ENTER TO WIN', false);
                console.error('Submission error:', error);
                alert('Sorry, there was an error submitting your form. Please try again.');
            }
        };

        const form = document.getElementById('form');
        const submitButton = document.getElementById('submitButton');
        const phoneInput = document.getElementById('phone');

        phoneInput.addEventListener('input', (e) => {
            e.target.value = formatPhoneNumber(e.target.value);
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            updateButtonState(submitButton, 'Submitting...', true);
            await handleSubmit(form, submitButton);
        });
    </script>
</body>
</html>
